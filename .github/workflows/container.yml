name: Container validation

# 发布构建已移入根 release.yml；本工作流只做 PR/手动的容器打包校验，不发布 GHCR。
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  binaries:
    name: Build static binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88 and musl targets
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1
          use-cache: false

      - name: Install cargo-zigbuild
        run: |
          cargo install cargo-zigbuild \
            --git https://github.com/rust-cross/cargo-zigbuild.git \
            --rev bbb57ac6a5eb90f53617a5c218fda03080599e4a \
            --locked

      - name: Cross-build both architectures
        run: |
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          ./platforms/linux/scripts/cross-build.sh

      - name: Stage container binaries
        run: |
          set -Eeuo pipefail
          mkdir -p docker-bin
          cp platforms/linux/dist/sumpter-linux-x86_64/sumpterd docker-bin/sumpterd-amd64
          cp platforms/linux/dist/sumpter-linux-aarch64/sumpterd docker-bin/sumpterd-arm64
          chmod 0755 docker-bin/sumpterd-amd64 docker-bin/sumpterd-arm64
          file docker-bin/sumpterd-amd64 docker-bin/sumpterd-arm64

      - name: Upload docker-bin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-bin-${{ github.sha }}
          path: docker-bin/
          if-no-files-found: error
          retention-days: 7

  pr-check:
    name: PR image pack check
    needs: binaries
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download docker-bin
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-bin-${{ github.sha }}
          path: docker-bin

      - name: Prepare runtime image context
        run: |
          set -Eeuo pipefail
          mkdir -p platforms/linux/docker-bin
          cp docker-bin/sumpterd-amd64 docker-bin/sumpterd-arm64 platforms/linux/docker-bin/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
          cache-binary: false

      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./platforms/linux
          file: ./platforms/linux/Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly
          provenance: false
          sbom: false
