name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  rust:
    name: Rust 1.88
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88 with rustfmt and clippy
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy

      - name: Check Rust workspace
        run: ./scripts/check.sh rust

  web:
    name: Sumpter WebUI build and self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0

      - name: Install Sumpter WebUI dependencies
        working-directory: platforms/linux/webui
        run: npm ci

      - name: Build Sumpter WebUI
        working-directory: platforms/linux/webui
        run: npm run build

      - name: Test Sumpter WebUI contract
        working-directory: platforms/linux/webui
        run: npm test

      - name: Test pi attribution extension and packaged copies
        run: node --test scripts/tests/pi-project-attribution.test.mjs

      - name: Test unified client attribution and packaged copies
        run: node --test scripts/tests/client-attribution.test.mjs

      - name: Verify generated WebUI is synchronized
        run: |
          set -euo pipefail
          test -f platforms/linux/web/index.html
          test -d platforms/linux/web/assets
          test "$(find platforms/linux/web/assets -type f | wc -l)" -ge 2
          git diff --exit-code -- platforms/linux/web
          test -z "$(git ls-files --others --exclude-standard -- platforms/linux/web)"

      - name: Run static mirror bootstrap self-test
        run: ./platforms/linux/scripts/bootstrap-installer-selftest.sh

      - name: Run static mirror uninstall bootstrap self-test
        run: ./platforms/linux/scripts/bootstrap-uninstaller-selftest.sh

      - name: Run installer transaction self-test
        run: ./platforms/linux/scripts/installer-selftest.sh

      # Claude Code 项目归因配置器。runner 上没有 zsh,显式只跑 bash 分支——
      # 不依赖 runner 恰好装了什么。zsh 与 bash 3.2 的覆盖在 macOS 本地跑。
      # 两个 OS 条件分支都由假 uname 覆盖,所以在 Linux 上跑结论一样。
      - name: Run Claude Code attribution installer self-test
        run: ./platforms/linux/scripts/cc-project-attribution-selftest.sh
        env:
          SUMPTER_TEST_SHELLS: /bin/bash

  macos:
    name: macOS App
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Swift toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build and test App
        run: ./scripts/check.sh macos

  repository:
    name: Repository contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Check documentation and source export contracts
        run: ./scripts/check.sh docs
