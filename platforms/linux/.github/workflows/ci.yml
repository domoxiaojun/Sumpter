name: CI

# 私有仓库的 Actions 按分钟计费,所以 push 不再自动触发 —— 本地已有等价门禁
# (cargo fmt/check/test、npm test、shellcheck、release-preflight)。需要在 CI 上验证时
# 开 PR 或手动 workflow_dispatch。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  rust:
    name: Rust 1.88
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88 with rustfmt
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Test workspace
        run: cargo test --workspace --locked

  web:
    name: Gemini WebUI build and self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0

      - name: Install Gemini WebUI dependencies
        working-directory: webui
        run: npm ci

      - name: Build Gemini WebUI
        working-directory: webui
        run: npm run build

      - name: Test Gemini WebUI contract
        working-directory: webui
        run: npm test

      - name: Check generated WebUI is complete
        run: test -f web/index.html && test -d web/assets && test "$(find web/assets -type f | wc -l)" -ge 2

      - name: Run static mirror bootstrap self-test
        run: ./scripts/bootstrap-installer-selftest.sh

      - name: Run static mirror uninstall bootstrap self-test
        run: ./scripts/bootstrap-uninstaller-selftest.sh

      - name: Run installer transaction self-test
        run: ./scripts/installer-selftest.sh

      # Claude Code 项目归因配置器。runner 上没有 zsh,显式只跑 bash 分支——
      # 不依赖 runner 恰好装了什么。zsh 与 bash 3.2 的覆盖在 macOS 本地跑。
      # 两个 OS 条件分支都由假 uname 覆盖,所以在 Linux 上跑结论一样。
      - name: Run Claude Code attribution installer self-test
        run: ./scripts/cc-project-attribution-selftest.sh
        env:
          KEKULV_TEST_SHELLS: /bin/bash
