name: Container

# Build static binaries with cargo-zigbuild (same path as Release), then pack a
# thin multi-arch image. Avoids compiling Rust under QEMU (which hit 60m timeout).

# 触发面收窄以省 Actions 额度(私有仓库按分钟计费,多架构 buildx 每次约 10 分钟):
# 镜像是发布交付物,所以只在版本 tag 上构建并推 GHCR;main push 不再触发。
# PR 仍跑 pr-check(只打包校验、不推镜像),手动 dispatch 只跑 binaries。
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  binaries:
    name: Build static binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88 and musl targets
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1
          use-cache: false

      - name: Install cargo-zigbuild
        run: |
          cargo install cargo-zigbuild \
            --git https://github.com/rust-cross/cargo-zigbuild.git \
            --rev bbb57ac6a5eb90f53617a5c218fda03080599e4a \
            --locked

      - name: Cross-build both architectures
        run: |
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          ./scripts/cross-build.sh

      - name: Stage docker-bin names for TARGETARCH
        run: |
          set -euo pipefail
          mkdir -p docker-bin
          cp dist/sumpter-linux-x86_64/sumpterd docker-bin/sumpterd-amd64
          cp dist/sumpter-linux-aarch64/sumpterd docker-bin/sumpterd-arm64
          chmod 0755 docker-bin/sumpterd-amd64 docker-bin/sumpterd-arm64
          file docker-bin/sumpterd-amd64 docker-bin/sumpterd-arm64

      - name: Upload docker-bin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-bin-${{ github.sha }}
          path: docker-bin/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish multi-architecture image
    needs: binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download docker-bin
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-bin-${{ github.sha }}
          path: docker-bin

      - name: Normalize GHCR image name
        id: image
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: printf 'name=ghcr.io/%s\n' "${GH_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
          cache-binary: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and publish (thin multi-arch)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=min
          sbom: true

  pr-check:
    name: PR image pack check
    needs: binaries
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download docker-bin
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-bin-${{ github.sha }}
          path: docker-bin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
          cache-binary: false

      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly
          provenance: false
          sbom: false
