# 独立部署：把本文件放进任意 sumpter/ 目录即可；需要改端口或镜像时直接编辑本文件。
# 运行镜像固定来自 GHCR 官方发布（由 Release 工作流构建的双架构 manifest），本文件不含 build。
x-runtime: &runtime
  image: ghcr.io/domoxiaojun/sumpter:latest
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes:
    # SELinux 主机（Fedora/RHEL）在结尾追加 :z，例如 ./config:/config:z
    - ./config:/config

services:
  # 使用同一镜像的 shell 完成首次初始化，不需要宿主机 Python、jq 或新版 daemon。
  # 只创建缺失文件；绝不以模板覆盖已有配置、密码或数据库。
  init:
    <<: *runtime
    network_mode: none
    working_dir: /config
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        # 新文件已由 umask 限定为 0600；chmod 只作为加固，
        # NFS/CIFS 等挂载可能拒绝 chmod，不应因此阻止 daemon 启动。
        chmod 700 . 2>/dev/null || echo "警告：无法把 /config 权限设为 0700，请自行确认目录权限" >&2
        for file in config.json admin-password; do
          if [ -L "$$file" ] || { [ -e "$$file" ] && [ ! -f "$$file" ]; }; then
            echo "拒绝使用非普通文件: $$file" >&2
            exit 1
          fi
        done
        if [ ! -e config.json ] && [ -e keys.json ]; then
          echo "检测到旧 keys.json；请先手工迁移，不自动创建新配置" >&2
          exit 1
        fi
        stage=$$(mktemp -d .sumpter-init.XXXXXX)
        trap 'rm -rf "$$stage"' EXIT
        if [ ! -e admin-password ]; then
          od -An -N32 -tx1 /dev/urandom | tr -d ' \n' > "$$stage/admin-password"
          test "$$(wc -c < "$$stage/admin-password")" -eq 64
          printf '\n' >> "$$stage/admin-password"
          ln "$$stage/admin-password" admin-password
          # 首次生成时把初始密码直接打进日志：容器里没有安装器那样的交互终端，
          # 让用户去宿主机 cat 文件是这条路线最大的首次使用摩擦点。只在创建时打印；
          # 不想让明文进日志的用户先自己生成 admin-password 即可（DOCKER.md
          # 「自备 config.json 与初始密码」），文件已存在时这里不会打印。
          echo "已生成 Admin 密码文件:/config/admin-password"
          echo "初始密码:$$(cat admin-password)"
          echo "请登录后立即在 WebUI「安全」页修改；改密后初始密码立即失效"
        fi
        if [ ! -e config.json ]; then
          printf '%s\n' '{"schemaVersion":7,"endpoints":[],"listener":{"host":"0.0.0.0","port":57878,"authToken":"","allowedCIDRs":[]}}' > "$$stage/config.json"
          ln "$$stage/config.json" config.json
        fi
        chmod 600 config.json admin-password 2>/dev/null \
          || echo "警告：无法把 config.json / admin-password 权限设为 0600，请自行确认" >&2

  sumpter:
    <<: *runtime
    depends_on:
      init:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      RUST_LOG: info
      TZ: UTC
      # bridge 容器内固定监听；宿主机端口直接在 ports 中修改。
      SUMPTER_ADMIN_HOST: "0.0.0.0"
      SUMPTER_ADMIN_PORT: "57879"
      SUMPTER_ADMIN_PASSWORD_FILE: /config/admin-password
      # 不要在这里加 HTTP_PROXY/HTTPS_PROXY/ALL_PROXY：引擎的数据面与模型探测都显式
      # `.no_proxy()`，这些变量不会让上游流量走代理（见 DOCKER.md 的环境变量一节）。
    ports:
      - "127.0.0.1:57878:57878"
      - "127.0.0.1:57879:57879"
    # 探针来自镜像元数据（Dockerfile 的 HEALTHCHECK，读 SUMPTER_ADMIN_PORT，只打容器内端口），
    # 这里不重复声明，避免与镜像漂移；`docker compose up --wait` 仍按容器健康状态等待。
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
