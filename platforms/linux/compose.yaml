# sumpter Docker Compose（Linux 主机）
# 同名：docker-compose.yml → 本文件
#
# 设计：
#   - 默认使用 GHCR :latest，不在本机 cargo/docker build
#   - 配置与运行数据 bind 到当前目录 ./config
#   - SUMPTER_ADMIN_* / RUST_LOG 从宿主机环境透传进容器
#
# 首次：
#   mkdir -p config
#   docker compose pull && docker compose up -d
#   打开 http://127.0.0.1:57879/admin/
#
# 升级：
#   docker compose pull && docker compose up -d
#
# :latest 由统一 Release 工作流更新。
# 私有 GHCR 需先 docker login。钉死版本：export SUMPTER_IMAGE=ghcr.io/domoxiaojun/sumpter:0.3.4
#
# 仅 Linux host network。镜像与 Compose 都不指定运行用户，默认由 root 写 ./config。
# Admin 默认读取 ./config/admin-password 并提供 WebUI 内置登录；公网反代仍必须使用 HTTPS。

services:
  sumpter:
    image: ${SUMPTER_IMAGE:-ghcr.io/domoxiaojun/sumpter:latest}
    # 本机编镜像见 compose.build.example.yaml

    network_mode: host
    # bridge 见 compose.bridge.example.yaml（须 Admin 听 0.0.0.0）

    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s

    environment:
      RUST_LOG: ${RUST_LOG:-info}
      # 必须列出才会传入容器；宿主机 export / 命令前缀 / .env 均可覆盖
      SUMPTER_ADMIN_HOST: ${SUMPTER_ADMIN_HOST:-127.0.0.1}
      SUMPTER_ADMIN_PORT: ${SUMPTER_ADMIN_PORT:-57879}
      # 启动前必须创建 ./config/admin-password；daemon 会按 --config-dir 自动读取。
      # 高级自定义路径才需要 SUMPTER_ADMIN_PASSWORD_FILE。
      # SUMPTER_WEB_ROOT: /opt/sumpter/web

    # CLI 优先于环境变量；取消注释须写全
    # command:
    #   - --config-dir
    #   - /config
    #   - --web-root
    #   - /opt/sumpter/web
    #   - --admin-host
    #   - "0.0.0.0"
    #   - --admin-port
    #   - "57879"

    volumes:
      - ./config:/config
      # - ./web:/opt/sumpter/web:ro

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-T",
          "3",
          "-O",
          "/dev/null",
          "http://127.0.0.1:${SUMPTER_ADMIN_PORT:-57879}/healthz",
        ]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 10s

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Fedora SELinux 挂载异常时可改成同时带 label=disable
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
